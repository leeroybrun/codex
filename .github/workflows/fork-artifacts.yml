name: fork-artifacts (unsigned codex binaries)

on:
  push:
    branches:
      # Build+release from the stable-base branch only, so the version label is truthful.
      - mcp-resume-fork/stable
  workflow_dispatch: {}

jobs:
  build:
    name: Build — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimal set for Happy usage: macOS (Apple Silicon) + Linux (glibc).
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          # Needed so `git describe --tags` works in the release job (tags).
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --target ${{ matrix.target }} \
            --release \
            --bin codex \
            --bin codex-responses-api-proxy

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/dist/${{ matrix.target }}"
          mkdir -p "$dest"

          cp "target/${{ matrix.target }}/release/codex" "$dest/codex-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/codex-responses-api-proxy" "$dest/codex-responses-api-proxy-${{ matrix.target }}"

          echo "Staged:"
          ls -la "$dest"

      - uses: actions/upload-artifact@v6
        with:
          name: codex-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/${{ matrix.target }}/*

  release:
    name: Release (per-push)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute base version + release identifiers
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Determine the latest *stable production release tag that our current branch is based on*.
          #
          # Concretely: the newest ancestor tag of HEAD that corresponds to a non-draft,
          # non-prerelease GitHub Release in openai/codex.
          #
          # We do it this way to avoid falsely labeling a fork build as "0.84.0" if our HEAD
          # doesn't include that upstream release yet.
          base_tag=""
          mapfile -t candidates < <(
            git tag -l 'rust-v*' --merged HEAD --sort=-creatordate
          )

          if ((${#candidates[@]} == 0)); then
            echo "No rust-v* tags are ancestors of HEAD; cannot label release version."
            exit 1
          fi

          for t in "${candidates[@]}"; do
            # Fast filter: only consider version-like tags (no prerelease suffix).
            if [[ ! "$t" =~ ^rust-v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
              continue
            fi

            # Confirm this tag corresponds to a stable GitHub Release in openai/codex.
            # (Works even when our fork doesn't have upstream's release workflow.)
            rel_json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/openai/codex/releases/tags/${t}" \
              || true)"

            if [[ -z "$rel_json" ]]; then
              continue
            fi

            if echo "$rel_json" | jq -e '.draft == false and .prerelease == false' >/dev/null 2>&1; then
              base_tag="$t"
              break
            fi
          done

          if [[ -z "${base_tag}" ]]; then
            echo "Failed to determine a stable rust-vX.Y.Z release tag that is an ancestor of HEAD."
            echo "Candidates (ancestors):"
            printf '  - %s\n' "${candidates[@]}"
            exit 1
          fi

          base_version="${base_tag#rust-v}"
          commits_since_tag="$(git rev-list --count "${base_tag}..HEAD")"

          build_number="${{ github.run_number }}"
          build_attempt="${{ github.run_attempt }}"

          name="${base_version}-build-${build_number}-a${build_attempt}"
          tag="fork-rust-v${base_version}-build-${build_number}-a${build_attempt}"

          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commits_since_tag=$commits_since_tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: List staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R dist/

      - name: Create GitHub Release (and attach artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            Base tag: ${{ steps.version.outputs.base_tag }}
            Commits since base tag: ${{ steps.version.outputs.commits_since_tag }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: dist/**/*
