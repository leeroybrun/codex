name: fork-artifacts (unsigned codex binaries)

on:
  push:
    branches:
      # Keep this tight so we don't burn Actions minutes on every feature branch.
      - feat/mcp-codex-reply-session-recovery
  workflow_dispatch: {}

jobs:
  build:
    name: Build — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimal set for Happy usage: macOS (Apple Silicon) + Linux (glibc).
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          # Needed so `git describe --tags` works in the release job (tags).
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --target ${{ matrix.target }} \
            --release \
            --bin codex \
            --bin codex-responses-api-proxy

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/dist/${{ matrix.target }}"
          mkdir -p "$dest"

          cp "target/${{ matrix.target }}/release/codex" "$dest/codex-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/codex-responses-api-proxy" "$dest/codex-responses-api-proxy-${{ matrix.target }}"

          echo "Staged:"
          ls -la "$dest"

      - uses: actions/upload-artifact@v6
        with:
          name: codex-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/${{ matrix.target }}/*

  release:
    name: Release (per-push)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute base version + release identifiers
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Upstream uses semver-ish tags like rust-v0.80.0 for Rust releases.
          # The repo also contains non-semver rust-v0.0.<timestamp> tags; avoid those.
          base_tag="$(git describe --tags --match 'rust-v[0-9]*.[0-9]*.[0-9]*' --abbrev=0)"
          base_version="${base_tag#rust-v}"
          base_describe="$(git describe --tags --match 'rust-v[0-9]*.[0-9]*.[0-9]*' --long --always)"

          build_number="${{ github.run_number }}"
          build_attempt="${{ github.run_attempt }}"

          name="${base_version}-build-${build_number}-a${build_attempt}"
          tag="fork-rust-v${base_version}-build-${build_number}-a${build_attempt}"

          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "base_describe=$base_describe" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: List staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R dist/

      - name: Create GitHub Release (and attach artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            Base tag: ${{ steps.version.outputs.base_tag }}
            Base describe: ${{ steps.version.outputs.base_describe }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: dist/**/*
