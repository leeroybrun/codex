name: fork-artifacts (unsigned codex binaries)

on:
  push:
    branches:
      # Build+release from the stable-base branch only, so the version label is truthful.
      - mcp-resume-fork/stable
  workflow_dispatch: {}

env:
  # Gate npm publishing behind repo variables so the workflow doesn't fail by default.
  # Configure in GitHub: Settings → Secrets and variables → Actions → Variables.
  ENABLE_FORK_NPM_PUBLISH: ${{ vars.ENABLE_FORK_NPM_PUBLISH }}
  # Must match codex-rs/mcp-server/npm/package.json "name".
  # Example: @leeroy/codex-mcp-resume
  FORK_NPM_PACKAGE_NAME: ${{ vars.FORK_NPM_PACKAGE_NAME }}

jobs:
  build:
    name: Build — ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          # Broad set aligned with upstream so fork artifacts are usable on macOS/Linux/Windows.
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install_musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install_musl: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          # Needed so `git describe --tags` works in the release job (tags).
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}

      - if: ${{ matrix.install_musl }}
        name: Install musl build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Cargo build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --target ${{ matrix.target }} \
            --release \
            --bin codex \
            --bin codex-responses-api-proxy \
            --bin codex-mcp-server

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/dist/${{ matrix.target }}"
          mkdir -p "$dest"

          if [[ "${{ contains(matrix.target, 'windows') }}" == 'true' ]]; then
            cp "target/${{ matrix.target }}/release/codex.exe" "$dest/codex-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/codex-responses-api-proxy.exe" "$dest/codex-responses-api-proxy-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/codex-mcp-server.exe" "$dest/codex-mcp-server-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/codex" "$dest/codex-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/codex-responses-api-proxy" "$dest/codex-responses-api-proxy-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/codex-mcp-server" "$dest/codex-mcp-server-${{ matrix.target }}"
          fi

          echo "Staged:"
          ls -la "$dest"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/${{ matrix.target }}/*

  release:
    name: Release (per-push)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute base version + release identifiers
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # We base our stable branch on upstream release tags (e.g. rust-v0.84.0), but those tags
          # do NOT exist in our fork repo unless explicitly pushed. Fetch upstream tags so
          # `git describe` can resolve the correct stable base version.
          git remote add upstream https://github.com/openai/codex.git 2>/dev/null || true
          git fetch upstream --tags --force

          base_tag="$(git describe --tags --match 'rust-v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 HEAD)"
          if [[ -z "${base_tag}" ]]; then
            echo "Failed to determine base rust-vX.Y.Z tag via git describe."
            exit 1
          fi

          base_version="${base_tag#rust-v}"
          commits_since_tag="$(git rev-list --count "${base_tag}..HEAD")"

          build_number="${{ github.run_number }}"
          build_attempt="${{ github.run_attempt }}"

          name="${base_version}-build-${build_number}-a${build_attempt}"
          tag="fork-rust-v${base_version}-build-${build_number}-a${build_attempt}"
          npm_version="${base_version}-resume.${build_number}.a${build_attempt}"

          echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commits_since_tag=$commits_since_tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: List staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R dist/

      - name: Create GitHub Release (and attach artifacts)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            Base tag: ${{ steps.version.outputs.base_tag }}
            Commits since base tag: ${{ steps.version.outputs.commits_since_tag }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: dist/**/*

  npm:
    name: Package + publish npm (codex-mcp-server-resume)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # for npm trusted publishing (OIDC)
    if: ${{ env.ENABLE_FORK_NPM_PUBLISH == 'true' && env.FORK_NPM_PACKAGE_NAME != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute npm version (semver)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/openai/codex.git 2>/dev/null || true
          git fetch upstream --tags --force
          base_tag="$(git describe --tags --match 'rust-v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 HEAD)"
          if [[ -z "${base_tag}" ]]; then
            echo "Failed to determine base rust-vX.Y.Z tag via git describe."
            exit 1
          fi
          base_version="${base_tag#rust-v}"
          build_number="${{ github.run_number }}"
          build_attempt="${{ github.run_attempt }}"
          npm_version="${base_version}-resume.${build_number}.a${build_attempt}"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Assemble npm staging directory
        shell: bash
        env:
          PACKAGE_NAME: ${{ env.FORK_NPM_PACKAGE_NAME }}
          NPM_VERSION: ${{ steps.version.outputs.npm_version }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/codex-mcp-server-resume-npm"
          rm -rf "$staging"
          mkdir -p "$staging/vendor"

          cp -R codex-rs/mcp-server/npm/bin "$staging/"
          cp codex-rs/mcp-server/npm/package.json "$staging/"
          cp codex-rs/mcp-server/npm/README.md "$staging/"

          shopt -s nullglob
          for target_dir in dist/*; do
            target="$(basename "$target_dir")"
            mkdir -p "$staging/vendor/$target/codex-mcp-server"
            if [[ -f "$target_dir/codex-mcp-server-${target}.exe" ]]; then
              cp "$target_dir/codex-mcp-server-${target}.exe" "$staging/vendor/$target/codex-mcp-server/codex-mcp-server.exe"
            elif [[ -f "$target_dir/codex-mcp-server-${target}" ]]; then
              cp "$target_dir/codex-mcp-server-${target}" "$staging/vendor/$target/codex-mcp-server/codex-mcp-server"
            else
              echo "Missing codex-mcp-server artifact for target $target"
              exit 1
            fi
          done

          chmod +x "$staging"/vendor/*/codex-mcp-server/codex-mcp-server 2>/dev/null || true

          node - <<'NODE'
            import fs from "node:fs";
            import path from "node:path";
            const stagingDir = process.env.STAGING_DIR;
            const version = process.env.NPM_VERSION;
            const pkgName = process.env.PACKAGE_NAME;
            if (!version) throw new Error("Missing NPM_VERSION");
            if (!pkgName) throw new Error("Missing PACKAGE_NAME");
            const pkgPath = path.join(stagingDir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = version;
            pkg.name = pkgName;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          NODE
        env:
          STAGING_DIR: ${{ runner.temp }}/codex-mcp-server-resume-npm

      - name: Create npm tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-npm
          staging="${RUNNER_TEMP}/codex-mcp-server-resume-npm"
          pack_info=$(cd "$staging" && npm pack --ignore-scripts --json --pack-destination "${GITHUB_WORKSPACE}/dist-npm")
          filename=$(PACK_INFO="$pack_info" node -e 'const data = JSON.parse(process.env.PACK_INFO); console.log(data[0].filename);')
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          ls -la dist-npm/

      - name: Publish to npm (OIDC trusted publishing)
        env:
          NPM_TARBALL: ${{ steps.pack.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish --access public "${GITHUB_WORKSPACE}/dist-npm/${NPM_TARBALL}"
