name: "[FORK] sync upstream stable tag → mcp-resume-fork/stable"

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 03:17 UTC (random-ish to avoid spikes).
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: openai/codex
  UPSTREAM_REMOTE_URL: https://github.com/openai/codex.git
  STABLE_BRANCH: mcp-resume-fork/stable
  # Optional: set `FORK_SYNC_PUSH_TOKEN` (PAT classic: `repo` + `workflow`) to allow pushing
  # branches that include changes under `.github/workflows/*`.
  PUSH_TOKEN: ${{ secrets.FORK_SYNC_PUSH_TOKEN || github.token }}

jobs:
  sync:
    name: Sync mcp-resume-fork/stable to latest upstream stable tag (if clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote + fetch tags
        shell: bash
        run: |
          set -euo pipefail
          if ! git remote | grep -q '^upstream$'; then
            git remote add upstream "${UPSTREAM_REMOTE_URL}"
          fi
          git fetch upstream --tags
          git fetch origin

      - name: Determine latest stable upstream tag
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use GitHub "latest release" to avoid prereleases.
          tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            | jq -r '.tag_name' | tr -d '\r\n')"

          echo "latest upstream tag (raw): $(printf %q "${tag}")"

          if [[ -z "${tag}" ]]; then
            echo "Could not determine a stable rust-vX.Y.Z tag from releases/latest (empty tag)."
            exit 1
          fi

          # NOTE: keep this as a standalone test; mixing `||` and `! ... =~ ...` can be parsed
          # in surprising ways across bash versions.
          if [[ ! "${tag}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a stable rust-vX.Y.Z tag from releases/latest. Got '${tag}'."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Determine current base tag of stable branch
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/remotes/origin/${STABLE_BRANCH}"; then
            echo "Missing branch origin/${STABLE_BRANCH}. Create it first (see docs/fork-maintenance.md)."
            exit 1
          fi

          current_tag="$(git describe \
            --tags \
            --match 'rust-v[0-9]*.[0-9]*.[0-9]*' \
            --abbrev=0 \
            "origin/${STABLE_BRANCH}")"

          echo "tag=${current_tag}" >> "$GITHUB_OUTPUT"

      - name: No-op if already on latest stable
        if: ${{ steps.current.outputs.tag == steps.upstream.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "origin/${STABLE_BRANCH} already based on ${{
            steps.upstream.outputs.tag
          }}; nothing to do."

      - name: Create merge attempt branch from stable
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag }}
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          new_tag="${{ steps.upstream.outputs.tag }}"
          old_tag="${{ steps.current.outputs.tag }}"

          merge_branch="bot/merge-${new_tag}"
          tag_branch="bot/tag-${new_tag}"

          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "old_tag=${old_tag}" >> "$GITHUB_OUTPUT"
          echo "merge_branch=${merge_branch}" >> "$GITHUB_OUTPUT"
          echo "tag_branch=${tag_branch}" >> "$GITHUB_OUTPUT"

          git checkout -B "${merge_branch}" "origin/${STABLE_BRANCH}"

      - name: "Guard: upstream updated workflow files but no push token configured"
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag && secrets.FORK_SYNC_PUSH_TOKEN == '' }}
        shell: bash
        run: |
          set -euo pipefail
          new_tag="${{ steps.prep.outputs.new_tag }}"
          old_tag="${{ steps.prep.outputs.old_tag }}"

          if git diff --name-only "${old_tag}..${new_tag}" -- .github/workflows | grep -q '.'; then
            echo "Upstream changed files under .github/workflows between ${old_tag} and ${new_tag}."
            echo "The default GITHUB_TOKEN cannot push workflow file updates."
            echo "Set the Actions secret FORK_SYNC_PUSH_TOKEN (PAT classic: repo + workflow) and rerun."
            exit 1
          fi

      - name: Attempt merge of new upstream tag into stable (preferred)
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag }}
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          new_tag="${{ steps.prep.outputs.new_tag }}"
          old_tag="${{ steps.prep.outputs.old_tag }}"

          echo "Merging ${new_tag} into ${STABLE_BRANCH} (current base: ${old_tag})"
          if git merge --no-ff --no-commit "${new_tag}"; then
            git commit -m "Merge ${new_tag} into ${STABLE_BRANCH}"
            echo "mode=merge" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflict. Leaving this for a tag-based PR so conflicts are visible in GitHub UI."
            git merge --abort || true
            echo "mode=tag-pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merge attempt branch (clean merges only)
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag && steps.merge.outputs.mode == 'merge' }}
        shell: bash
        run: |
          set -euo pipefail
          git push -u origin "${{ steps.prep.outputs.merge_branch }}" --force-with-lease

      - name: Create tag branch (conflict PR)
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag && steps.merge.outputs.mode == 'tag-pr' }}
        shell: bash
        run: |
          set -euo pipefail
          new_tag="${{ steps.prep.outputs.new_tag }}"
          tag_branch="${{ steps.prep.outputs.tag_branch }}"
          git checkout -B "${tag_branch}" "${new_tag}"
          git push -u origin "${tag_branch}" --force-with-lease

      - name: Open PR (merge succeeded)
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag && steps.merge.outputs.mode == 'merge' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          new_tag="${{ steps.prep.outputs.new_tag }}"
          merge_branch="${{ steps.prep.outputs.merge_branch }}"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${STABLE_BRANCH}" \
            --head "${merge_branch}" \
            --title "Merge ${new_tag} into ${STABLE_BRANCH}" \
            --body "Automated merge of upstream stable tag ${new_tag} into ${STABLE_BRANCH}."

      - name: Open PR (merge conflicts – resolve in GitHub UI)
        if: ${{ steps.current.outputs.tag != steps.upstream.outputs.tag && steps.merge.outputs.mode == 'tag-pr' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          new_tag="${{ steps.prep.outputs.new_tag }}"
          tag_branch="${{ steps.prep.outputs.tag_branch }}"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${STABLE_BRANCH}" \
            --head "${tag_branch}" \
            --title "Merge ${new_tag} into ${STABLE_BRANCH} (conflicts expected)" \
            --body $'Automated PR to merge upstream stable tag into the fork stable branch.\n\nThis merge had conflicts in CI, so this PR is intended for manual conflict resolution in GitHub UI.\n\nUpstream tag: '"${new_tag}"$'\nBase branch: '"${STABLE_BRANCH}"
